name: Publish to pub.dev

# Off until switched on. The trigger below matches exactly the tags dev/release.sh
# pushes, so without the guard this would fire on every release and fail, because
# pub.dev does not trust this repository to publish anything yet. The guard is a
# repository variable rather than a comment, so turning it on is one setting and needs
# no commit:
#
#   Settings, Secrets and variables, Actions, Variables:  PUBLISH_FROM_CI = true
#
# Before setting it, each of the three packages needs this on its own pub.dev admin
# page, under Automated publishing:
#
#   Repository:   Mauznemo/FlutterAndroidAuto
#   Tag pattern:  v{{version}}
#
# pub.dev then verifies over OIDC that the request came from this repository at that
# tag, and that the tag agrees with the version in pubspec.yaml. No secret is stored
# here or on the machine.
#
# The first release cannot use any of this: a package has no admin page until it has
# been published once. So v0.1.0 goes up from dev/release.sh, and this takes over
# afterwards, at which point set PUBLISH_FROM_CI=1 in the script too so it stops
# publishing directly and only tags. Full walkthrough in docs/releasing.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# What the reusable workflow needs to mint an OIDC token. Nothing else is granted.
permissions:
  id-token: write

jobs:
  # In dependency order, serialised with `needs`, because pub.dev will not accept a
  # package whose dependencies it has never heard of. The versions are in lockstep, so
  # android_auto's constraint on android_auto_native is satisfied only once the latter
  # is actually up.
  platform_interface:
    if: vars.PUBLISH_FROM_CI == 'true'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@main
    with:
      working-directory: packages/android_auto_platform_interface

  # Not the reusable workflow the other two use. That one publishes a bare checkout, and
  # this package ships the prebuilt Android dependencies, which are kept out of git and
  # published through android/.pubignore. They are built here first, on the same cache
  # the release build fills, and the publish refuses to go ahead without all three.
  linux:
    needs: platform_interface
    if: vars.PUBLISH_FROM_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Configures the OIDC token pub.dev accepts, as the reusable workflow does.
      - uses: dart-lang/setup-dart@v1

      - name: Install the NDK and the host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler ninja-build
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes ends on a broken pipe once sdkmanager stops reading, which pipefail
          # would otherwise report as a failure of the whole step.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore the Android dependencies
        uses: actions/cache@v4
        with:
          path: packages/android_auto_native/android/deps
          key: android-deps-${{ hashFiles('tools/build-android-deps.sh') }}

      - name: Build the Android dependencies
        run: tools/build-android-deps.sh

      - name: Publish
        working-directory: packages/android_auto_native
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "android/deps/$abi/lib/libboost_log.a" ] \
              || { echo "::error::no Android dependencies for $abi"; exit 1; }
          done
          dart pub get
          dart pub publish --force

  app:
    needs: linux
    if: vars.PUBLISH_FROM_CI == 'true'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@main
    with:
      working-directory: packages/android_auto
