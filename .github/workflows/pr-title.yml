name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            test
            revert
          requireScope: false
          subjectPattern: '^(?!.*\.$)[a-z0-9][^\s]*( [^\s]+){1,14}$'
          subjectPatternError: |
            The subject "{subject}" does not match the project's style.

            A title is `<type>: <subject>` on one line: lowercase, no trailing
            period, and short. Aim for 2 to 10 words, this check only fails past
            15. `fix:` names the broken behaviour rather than the repair, `feat:`
            names the capability.

            For example: `fix: notification icon size`, `feat: add FCM support`.

            The full rules are in CONTRIBUTING.md.
