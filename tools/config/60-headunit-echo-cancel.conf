# Acoustic echo cancellation for a head unit. Install with tools/install-echo-cancel.sh.
#
# Why this exists: a head unit plays the far end of a phone call through the car's
# speakers and listens with a microphone in the same cabin, so the microphone hears the
# far end and sends it straight back up the Bluetooth uplink. The far end then hears
# itself a few hundred milliseconds late, which is considerably worse than hearing
# nothing at all.
#
# The phone will not do this for us. A phone on speakerphone cancels its own echo, but
# the moment a call is routed to a Bluetooth hands free unit it stops, because only the
# head unit knows what its own speakers played and how long the cabin took to send it
# back. The ec_enabled field the phone sends is asking whether this has been handled
# already, not offering to handle it.
#
# Measured on the reference machine: the microphone picks the speakers up at 19.8 dB
# above the room floor, and 61.2 dB of that is suppressed, leaving the echo below the
# uplink's own idle noise floor. See docs/echo-cancellation.md for how to repeat that on
# other hardware, which is worth doing, because it depends on where the microphone sits
# relative to the speakers.
#
# No device is named anywhere in here, so the same file works on any machine.

context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      # Take the reference from whatever the speakers are actually playing rather than
      # from one nominated application. That is what makes this cancel the call audio,
      # the navigation prompts and the media alike, without naming any of them.
      monitor.mode = true

      library.name = aec/libspa-aec-webrtc

      aec.args = {
        # Engine and road rumble, which is most of what a car adds to a microphone.
        webrtc.high_pass_filter = true
        # A driver is never at a fixed distance from the microphone.
        webrtc.gain_control = true
        webrtc.noise_suppression = true
        # Indicator ticks and door slams: loud, short, and not speech.
        webrtc.transient_suppression = true
        # Off deliberately. Voice detection gates the uplink on whether it believes
        # someone is talking, and a gate that guesses wrong clips the start of a word.
        webrtc.voice_detection = false
        # AECM, a lighter canceller meant for phone hardware. Worth turning on only if a
        # weak ARM head unit cannot afford the full one, and at a real cost in how much
        # echo survives. Measure before and after rather than assuming.
        webrtc.mobile_mode = false
      }

      capture.props = {
        # Attaches to the real microphone. The module puts its own nodes in one
        # node.link-group, which is what stops this from being routed back into the
        # canceller's own output once that output is the default source.
        node.name    = "headunit_aec_capture"
        node.passive = true
      }

      source.props = {
        # Higher priority than any real capture device, so this becomes the default
        # source. That is the whole routing story: the Bluetooth call uplink is an
        # ordinary capture stream that follows the default, and so is the Android Auto
        # microphone channel, so both land here without either being told to.
        #
        # The raw microphone is still present and can still be selected by name, for
        # hardware that already cancels echo and would only make it worse twice over.
        node.name        = "headunit_aec_source"
        node.description = "Head unit microphone (echo cancelled)"
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
]
