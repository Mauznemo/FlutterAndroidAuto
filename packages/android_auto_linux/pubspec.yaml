name: android_auto_linux
description: "Linux implementation of the android_auto plugin. Wraps the native head unit core (aasdk based) behind a C ABI and renders video into a Flutter texture."
version: 0.1.1
repository: https://github.com/Mauznemo/FlutterAndroidAuto
license: GPL-3.0-or-later

# Resolved as part of the workspace rooted at the repository root, so `flutter pub get`
# there covers this package too.
resolution: workspace

environment:
  sdk: ^3.13.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  android_auto_platform_interface: ^0.1.1
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^19.1.0

flutter:
  plugin:
    implements: android_auto
    platforms:
      linux:
        pluginClass: AndroidAutoLinuxPlugin
        dartPluginClass: AndroidAutoLinux

# aasdk carries the publicly known Google Automotive Link head unit certificate and its
# key, the same pair every open source Android Auto implementation uses, and its CMake
# reads both to compile them in. So the key cannot be left out of the package, and
# pub.dev's leak detection has to be told that it was never a secret. See the Licence
# section of the README.
false_secrets:
  - /linux/third_party/aasdk/cert/headunit.key
