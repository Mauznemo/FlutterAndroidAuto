# Generates the Dart bindings for the C ABI in linux/src/aa_core.h.
#
#   dart run ffigen --config ffigen.yaml
#
# Re-run this whenever aa_core.h changes. The generated file is committed so that
# building the package does not require libclang.

name: AaCoreBindings
description: |
  Bindings to the native Android Auto head unit core.

  Generated from linux/src/aa_core.h by package:ffigen. Do not edit by hand.
output: 'lib/src/bindings/aa_core_bindings.dart'
headers:
  entry-points:
    - 'linux/src/aa_core.h'
  include-directives:
    - '**aa_core.h'
functions:
  include:
    - 'aa_.*'
structs:
  include:
    - 'AaConfig'
    - 'AaSession'
    - 'AaTouchPoint'
enums:
  include:
    - 'AaState'
    - 'AaTouchAction'
typedefs:
  include:
    - 'AaEventCallback'
comments:
  style: any
  length: full
preamble: |
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: unused_element, unused_field, public_member_api_docs
  // coverage:ignore-file
