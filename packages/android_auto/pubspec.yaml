name: android_auto
description: "Embed an Android Auto head unit inside a Flutter app. Renders the projected screen into a Flutter Texture so the app can draw its own UI on top."
version: 0.0.1
repository: https://github.com/mauznemo/FlutterAndroidAuto
license: GPL-3.0-or-later
# publish_to stays until publishing is actually decided: the metadata below is ready,
# but an accidental `dart pub publish` should not be able to fire.
publish_to: none

# Resolved as part of the workspace rooted at the repository root, so `flutter pub get`
# there covers this package too.
resolution: workspace

environment:
  sdk: ^3.13.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  android_auto_platform_interface:
    path: ../android_auto_platform_interface
  android_auto_linux:
    path: ../android_auto_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: android_auto_linux
