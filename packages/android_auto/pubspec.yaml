name: android_auto
description: "Embed an Android Auto head unit inside a Flutter app. Renders the projected screen into a Flutter Texture so the app can draw its own UI on top."
version: 0.0.1
repository: https://github.com/mauznemo/FlutterAndroidAuto
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  android_auto_platform_interface:
    path: ../android_auto_platform_interface
  android_auto_linux:
    path: ../android_auto_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: android_auto_linux
