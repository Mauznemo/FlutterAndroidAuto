name: android_auto
description: "Embed an Android Auto head unit inside a Flutter app. Renders the projected screen into a Flutter Texture so the app can draw its own UI on top."
version: 0.1.1
repository: https://github.com/Mauznemo/FlutterAndroidAuto
license: GPL-3.0-or-later

# Resolved as part of the workspace rooted at the repository root, so `flutter pub get`
# there covers this package too.
resolution: workspace

environment:
  sdk: ^3.13.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  android_auto_platform_interface: ^0.1.1
  android_auto_linux: ^0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: android_auto_linux
